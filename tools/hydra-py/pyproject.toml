[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-tenant-sdk"
version = "0.1.0"
description = "Python SDK for Hydra tenant self-service auth-cache invalidation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hydra" }]

[tool.setuptools.packages.find]
include = ["hydra_sdk*"]

[tool.setuptools.package-data]
hydra_sdk = ["py.typed"]
