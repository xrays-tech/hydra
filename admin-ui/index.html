<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Hydra Admin</title>
  <link rel="stylesheet" href="/admin/style.css" />
  <link rel="icon" href="data:," />
</head>
<body data-state="locked">

  <!-- ================= Login overlay =================
       Shown until the admin token is entered (design §13.3). The token is held
       only in-memory in app.js and attached as `Authorization: Bearer <token>`
       on every fetch. It is never persisted. -->
  <div id="login-overlay" class="overlay">
    <div class="auth-card">
      <div class="auth-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7c3 0 4 5 7 5s4-5 7-5" opacity=".8"/>
          <path d="M3 12c3 0 4 5 7 5s4-5 7-5"/>
          <circle cx="20" cy="12" r="1.6" fill="#fff" stroke="none"/>
        </svg>
      </div>
      <h1>Hydra <span class="grad">Admin</span></h1>
      <p class="auth-help">
        Enter the admin token (<code>HYDRA_ADMIN_TOKEN</code>). It is kept in
        memory only and sent as <code>Authorization: Bearer</code>.
      </p>
      <form id="login-form" class="auth-form" autocomplete="off">
        <div class="input-group">
          <label for="login-token">Admin token</label>
          <div class="input-wrap">
            <input type="password" id="login-token" autocomplete="off" autofocus
                   placeholder="paste token…" />
          </div>
        </div>
        <button class="btn primary block" id="login-btn" type="submit">Sign in</button>
        <div id="login-error" class="alert err hidden"></div>
      </form>
    </div>
  </div>

  <!-- ================= App shell ================= -->
  <div class="app" id="app" aria-hidden="true">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7c3 0 4 5 7 5s4-5 7-5" opacity=".8"/>
            <path d="M3 12c3 0 4 5 7 5s4-5 7-5"/>
            <circle cx="20" cy="12" r="1.6" fill="#fff" stroke="none"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name"><span class="grad">Hydra</span></span>
          <span class="brand-sub">admin console</span>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="sections"><!-- JS-rendered --></nav>

      <div class="sidebar-foot">
        <div class="token-status" id="token-status">
          <span class="dot"></span><span class="t">not authenticated</span>
        </div>
        <div class="foot-actions">
          <button class="btn ghost sm" id="reload-btn" title="POST /api/v1/reload">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v4h-4"/></svg>
            Reload
          </button>
          <button class="btn ghost sm danger" id="logout-btn" title="clear token">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
            Sign out
          </button>
        </div>
      </div>
    </aside>

    <div class="scrim" id="sidebar-scrim"></div>

    <!-- Main column -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="toggle navigation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="topbar-title">
          <h1 id="page-title">—</h1>
          <p id="page-sub" class="muted"></p>
        </div>
        <div class="topbar-actions" id="page-actions"></div>
      </header>
      <main class="content" id="content"><!-- JS-rendered --></main>
    </div>
  </div>

  <!-- Modal + toast mounts -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-stack" aria-live="polite"></div>

  <script src="/admin/app.js"></script>
  <script src="/admin/api-docs.js"></script>
</body>
</html>
