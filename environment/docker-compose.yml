# Hydra full-stack: proxy + shared relational config DB + mock-tenant auth + ClickHouse usage sink.
#
# The default stack uses PostgreSQL 16 (`postgres` service, `hydra:postgres`/`hydra:latest`). A MySQL
# 8 alternative is included under the `mysql` profile; to use it, build `DB_BACKEND=mysql
# ./environment/build.sh`, point `HYDRA_DB_URL` at `mysql://hydra:hydra@mysql:3306/hydra`, make the
# node `depends_on` mysql instead of postgres, and start with `docker compose --profile mysql up -d`.
#
# Database credentials in this file (`hydra/hydra`, database `hydra`) are LOCAL DEVELOPMENT defaults,
# not production secrets. Override them for any real deployment.
#
# Prerequisites:
#   1. Build the hydra image:  ./environment/build.sh            # postgres (default)
#                              DB_BACKEND=mysql ./environment/build.sh   # mysql variant
#   2. Copy the config template:  cp environment/config.example.json secure/config.json
#   3. Edit secure/config.json with your real provider api-keys + endpoints.
#   4. Generate the provider-key encryption master key (REQUIRED, fail-closed):
#          export HYDRA_ENCRYPTION_KEY="$(openssl rand 32 | base64)"
#      Provider api-keys are stored AES-256-GCM encrypted; without this key the
#      container refuses to start. Keep it safe — losing it makes the DB unreadable.
#   5. Export the admin bearer token (REQUIRED — there is no default). Also put
#      the same value in secure/config.json as "admin_token" so init.py can
#      authenticate:
#          export HYDRA_ADMIN_TOKEN="$(openssl rand -hex 32)"
#   6. Start:  cd environment && docker-compose up -d
#   7. Init:   python3 environment/init.py
#

services:
  hydra:
    image: hydra:latest
    container_name: hydra
    # Docker's default stop grace is 10s (SIGTERM, then SIGKILL), which is far
    # shorter than this process needs: it drains in-flight requests for
    # HYDRA_SHUTDOWN_DRAIN_SECS (default 20) plus a 5s final runtime step.
    # Measured 2026-09-29 on a release build: shutdown takes 25s on SIGTERM and
    # 35s on SIGQUIT, and a SIGKILLed drain loses the buffered usage records
    # (control: 20 proxied requests -> 0 rows in usage_record, vs 20 rows when
    # the drain completes). 30s covers the default SIGTERM path with slack;
    # use 40s if you also set `stop_signal: SIGQUIT`.
    stop_grace_period: 30s
    ports:
      - "8080:8080"   # proxy (HTTP)
      # Admin REST + UI + /metrics — published on LOOPBACK ONLY. This port has no
      # TLS, and its bearer token is the sole authority over tenants, providers
      # and every stored upstream api-key. Reach it from the host itself or over
      # an SSH tunnel; front it with an auth-terminating reverse proxy if it must
      # be reachable remotely. The container still binds 0.0.0.0 internally
      # (HYDRA_ADMIN_ADDR below) so this publish works.
      - "127.0.0.1:8081:8081"
      # Optional HTTPS entry — only useful with HYDRA_TLS_LISTEN set below.
      # - "8443:8443"
    environment:
      # REQUIRED — deliberately no default. A guessable admin token plus a
      # reachable admin port is a full gateway takeover. Generate:
      #   openssl rand -hex 32
      HYDRA_ADMIN_TOKEN: ${HYDRA_ADMIN_TOKEN:?set HYDRA_ADMIN_TOKEN="$(openssl rand -hex 32)" — required for the admin API}
      # Shared relational config database. The URL scheme MUST match the compiled backend:
      #   postgres -> postgres://USER:PASS@HOST:5432/DB   (postgres://hydra:hydra@postgres:5432/hydra)
      #   mysql    -> mysql://USER:PASS@HOST:3306/DB      (mysql://hydra:hydra@mysql:3306/hydra)
      HYDRA_DB_URL: "postgres://hydra:hydra@postgres:5432/hydra"
      # Plaintext entry — always bound. Adding tenant certs does NOT change it;
      # only HYDRA_TLS_LISTEN adds an HTTPS listener (per-tenant cert by SNI).
      HYDRA_LISTEN: "0.0.0.0:8080"
      # Optional HTTPS listener. Uncomment together with the "8443:8443" port
      # publish above and write tenant certs (Admin API `cert_pem`/`cert_key_pem`):
      # HYDRA_TLS_LISTEN: "0.0.0.0:8443"
      HYDRA_ADMIN_ADDR: "0.0.0.0:8081"
      HYDRA_USAGE_SINK: clickhouse
      HYDRA_CLICKHOUSE_URL: "http://clickhouse:8123"
      # Provider-key encryption master key (base64 of 32 bytes). REQUIRED — the
      # binary fail-closes without it. ${VAR:?...} makes compose itself fail fast
      # with this message if the operator forgot to export it.
      HYDRA_ENCRYPTION_KEY: ${HYDRA_ENCRYPTION_KEY:?set HYDRA_ENCRYPTION_KEY="$(openssl rand 32 | base64)" — required for provider-key encryption}
      RUST_LOG: info
    volumes:
      - hydra-config:/etc/hydra
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      mock-tenant:
        condition: service_healthy
    healthcheck:
      # /api/v1/health requires the admin Bearer token; $$ escapes to $ so the
      # shell expands HYDRA_ADMIN_TOKEN (set above) at healthcheck runtime.
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${HYDRA_ADMIN_TOKEN}\" http://localhost:8081/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Shared relational config database (DEFAULT backend) ────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hydra-postgres
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: hydra
      POSTGRES_DB: hydra
    ports:
      # Loopback only: this holds every tenant/provider/credential row.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydra -d hydra"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ── MySQL 8 alternative (opt-in: `--profile mysql`) ────────────────────────
  # Not started by default. Build the node with DB_BACKEND=mysql and set its
  # HYDRA_DB_URL to the URL below; see the file header for the full switch.
  mysql:
    image: mysql:8
    container_name: hydra-mysql
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: hydra
      MYSQL_USER: hydra
      MYSQL_PASSWORD: hydra
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uhydra -phydra --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  mock-tenant:
    build:
      context: ./mock_tenant
      dockerfile: Dockerfile.tenant
    container_name: mock-tenant
    ports:
      # Loopback only: this stand-in answers {"allowed":true} for ANY key
      # (environment/mock_tenant/app.py). Reachable from the host for debugging,
      # never from the network. Hydra uses the compose service name.
      - "127.0.0.1:9091:9091"
    healthcheck:
      # Python stdlib only (no curl in the mock image); GET /health -> {"status":"ok"}
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9091/health',timeout=2).status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    ports:
      # LOOPBACK ONLY, and this port carries NO authentication
      # (`CLICKHOUSE_SKIP_USER_SETUP: 1` below skips the default-user password).
      # `usage_record` holds every tenant's usage/billing rows — tenant_id,
      # model_key, the masked client key, token counts — and an unauthenticated
      # ClickHouse also accepts DROP/TRUNCATE. Hydra reaches it over the compose
      # network by service name (`http://clickhouse:8123`), so publishing these
      # on 0.0.0.0 bought nothing but exposure. The host-side acceptance tests
      # (`CH_URL=http://127.0.0.1:8123`) keep working: loopback is exactly where
      # they connect. Need remote access? Add CLICKHOUSE_USER/PASSWORD and put
      # the credentials in HYDRA_CLICKHOUSE_URL instead of reopening the port.
      - "127.0.0.1:8123:8123"   # HTTP interface (Hydra writes usage here)
      - "127.0.0.1:9000:9000"   # native TCP (optional: clickhouse-client)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # The schema is applied by the official entrypoint on FIRST start. It reads the
      # file as the container user, so every parent directory of this repository must be
      # traversable by that user: with the checkout under a `0700` home directory the
      # mount fails with `Permission denied`, ClickHouse starts WITHOUT `usage_record`,
      # and hydra's sink reports it on every retry (`usage sink batch insert failed …
      # Table default.usage_record does not exist`, measured 2026-09-30 while booting
      # this stack). The container's own log has the same story
      # (`/entrypoint.sh: running …/init.sql` then `Permission denied`). Check with
      # `docker compose exec clickhouse clickhouse-client -q 'SHOW TABLES'` after a fresh
      # start; if the table is missing, apply it through the HTTP interface:
      #   curl --data-binary @clickhouse/init.sql http://127.0.0.1:8123/
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # clickhouse-client is bundled in the official image.
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  hydra-config:
  postgres-data:
  mysql-data:
  clickhouse-data:
