# Hydra full-stack: proxy + mock-tenant auth + ClickHouse usage sink.
#
# Prerequisites:
#   1. Build the hydra image:  ./environment/build.sh
#   2. Copy the config template:  cp environment/config.example.json secure/config.json
#   3. Edit secure/config.json with your real provider api-keys + endpoints.
#   4. Generate the provider-key encryption master key (REQUIRED, fail-closed):
#          export HYDRA_ENCRYPTION_KEY="$(openssl rand 32 | base64)"
#      Provider api-keys are stored AES-256-GCM encrypted; without this key the
#      container refuses to start. Keep it safe — losing it makes the DB unreadable.
#   5. Export the admin bearer token (REQUIRED — there is no default). Also put
#      the same value in secure/config.json as "admin_token" so init.py can
#      authenticate:
#          export HYDRA_ADMIN_TOKEN="$(openssl rand -hex 32)"
#   6. Start:  cd environment && docker-compose up -d
#   7. Init:   python3 environment/init.py
#
version: "3.8"

services:
  hydra:
    image: hydra:latest
    container_name: hydra
    ports:
      - "8080:8080"   # proxy (HTTP)
      # Admin REST + UI + /metrics — published on LOOPBACK ONLY. This port has no
      # TLS, and its bearer token is the sole authority over tenants, providers
      # and every stored upstream api-key. Reach it from the host itself or over
      # an SSH tunnel; front it with an auth-terminating reverse proxy if it must
      # be reachable remotely. The container still binds 0.0.0.0 internally
      # (HYDRA_ADMIN_ADDR below) so this publish works.
      - "127.0.0.1:8081:8081"
    environment:
      # REQUIRED — deliberately no default. A guessable admin token plus a
      # reachable admin port is a full gateway takeover. Generate:
      #   openssl rand -hex 32
      HYDRA_ADMIN_TOKEN: ${HYDRA_ADMIN_TOKEN:?set HYDRA_ADMIN_TOKEN="$(openssl rand -hex 32)" — required for the admin API}
      HYDRA_DB_URL: "sqlite:/app/data/hydra.db?mode=rwc"
      HYDRA_LISTEN: "0.0.0.0:8080"
      HYDRA_ADMIN_ADDR: "0.0.0.0:8081"
      HYDRA_USAGE_SINK: clickhouse
      HYDRA_CLICKHOUSE_URL: "http://clickhouse:8123"
      # Provider-key encryption master key (base64 of 32 bytes). REQUIRED — the
      # binary fail-closes without it. ${VAR:?...} makes compose itself fail fast
      # with this message if the operator forgot to export it.
      HYDRA_ENCRYPTION_KEY: ${HYDRA_ENCRYPTION_KEY:?set HYDRA_ENCRYPTION_KEY="$(openssl rand 32 | base64)" — required for provider-key encryption}
      RUST_LOG: info
    volumes:
      - hydra-data:/app/data
    depends_on:
      clickhouse:
        condition: service_healthy
      mock-tenant:
        condition: service_healthy
    healthcheck:
      # /api/v1/health requires the admin Bearer token; $$ escapes to $ so the
      # shell expands HYDRA_ADMIN_TOKEN (set above) at healthcheck runtime.
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${HYDRA_ADMIN_TOKEN}\" http://localhost:8081/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mock-tenant:
    build:
      context: ./mock_tenant
      dockerfile: Dockerfile.tenant
    container_name: mock-tenant
    ports:
      - "9091:9091"
    healthcheck:
      # Python stdlib only (no curl in the mock image); GET /health -> {"status":"ok"}
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9091/health',timeout=2).status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    ports:
      - "8123:8123"   # HTTP interface (Hydra writes usage here)
      - "9000:9000"   # native TCP (optional: clickhouse-client)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # clickhouse-client is bundled in the official image.
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  hydra-data:
  clickhouse-data:
