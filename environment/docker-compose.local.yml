# =============================================================================
# LOCAL TEST ENVIRONMENT - 3-node Hydra cluster. NOT for production.
# =============================================================================
# Read ../LOCAL_TEST_ENV.md first: it holds the credentials, the runbook and the
# exact commands. That document is gitignored (it contains the upstream api-key).
#
# What is real here:
#   * the upstream LLM is the REAL SiliconFlow API (no mock LLM);
#   * redis and clickhouse are the real services;
#   * three real Hydra processes, ALL IDENTICAL raft members (ADR-0001: no leader/edge split)
#     over a real Redis backbone, with ClickHouse usage metering.
# Hydra authenticates client api-keys INTERNALLY (no auth_url hop). The local mock-llm
# below is the upstream stand-in used by the stability drills; no external auth service
# is needed.
#
# One small image is built from the repo Dockerfile (environment/Dockerfile),
# which COPYs the staged ./bin/hydra and installs ca-certificates + tini. An
# earlier revision of this file bind-mounted the binary instead and built
# nothing, but host-path bind mounts proved unreliable here (files became
# unreadable to the daemon mid-session), and the binary needs ca-certificates
# to verify api.siliconflow.cn over TLS. The build context is streamed by the
# docker CLI, so it works even when bind mounts do not; DOCKER_CONFIG and
# BUILDX_CONFIG are redirected into the workspace because ~/.docker is not
# writable here.
#
#   build:  ./environment/release.sh      # builds the FULL feature set
#           mkdir -p bin && cp -f target/release/hydra bin/hydra
#           DOCKER_CONFIG=$PWD/.docker BUILDX_CONFIG=$PWD/.buildx \
#             docker build -t hydra-local:latest -f environment/Dockerfile .
#
# A build WITHOUT the `arachne` feature REFUSES to boot once HYDRA_CLUSTER_PEERS is set
# (main.rs), so a binary from a narrower recipe can never join the cluster this file
# declares. `scripts/check_compose_env.cjs` derives that requirement from this file.
#
# Environment/Dockerfile is unchanged from the repo: it expects the binary
# staged at bin/hydra and already sets ENTRYPOINT tini + hydra and USER hydra.
#
#   up:    docker compose -f environment/docker-compose.local.yml up -d
#   seed:  python3 environment/init.py
#   down:  docker compose -f environment/docker-compose.local.yml down -v
# =============================================================================
#
# Explicit project name: the directory basename ("environment") is too generic
# and would make `down --remove-orphans` able to touch any other stack that
# reused it. Keep this stack isolated as `hydra-local`.
name: hydra-local

services:
  # ── Hydra node A - raft member (identical to node B and node C) ────────────
  hydra-a:
    image: hydra-local:latest
    container_name: hydra-a
    networks:
      default:
        ipv4_address: 172.28.0.11
    # Docker's default stop grace is 10s (SIGTERM, then SIGKILL), which is far
    # shorter than this process needs: it drains in-flight requests for
    # HYDRA_SHUTDOWN_DRAIN_SECS (default 20) plus a 5s final runtime step.
    # Measured 2026-09-29 on a release build: shutdown takes 25s on SIGTERM and
    # 35s on SIGQUIT, and a SIGKILLed drain loses the buffered usage records
    # (control: 20 proxied requests -> 0 rows in usage_record, vs 20 rows when
    # the drain completes). 30s covers the default SIGTERM path with slack;
    # use 40s if you also set `stop_signal: SIGQUIT`.
    stop_grace_period: 30s
    restart: unless-stopped
    env_file: [../secure/local-test.env]
    environment:
      # ADR-0001: the member list IS the cluster, and its ORDER is the cluster's identity
      # (raft ids are positional). Same string on all three nodes.
      HYDRA_CLUSTER_PEERS: "node-a=172.28.0.11:8091,node-b=172.28.0.12:8092,node-c=172.28.0.13:8093"
      HYDRA_NODE_ID: "node-a"
      HYDRA_ARACHNE_LISTEN: "172.28.0.11:8091"
      HYDRA_ARACHNE_DATA_DIR: "/app/data/arachne"
      HYDRA_REDIS_URL: "redis://redis:6379"
      HYDRA_REDIS_MODE: "single"
      HYDRA_USAGE_SINK: "clickhouse"
      HYDRA_CLICKHOUSE_URL: "http://clickhouse:8123"
      HYDRA_DB_URL: "sqlite:/app/data/hydra.db?mode=rwc"
      HYDRA_LISTEN: "0.0.0.0:8080"
      HYDRA_ADMIN_ADDR: "0.0.0.0:8081"
      # Bound every Redis command: a stalled Redis degrades instead of hanging
      # the data plane (crates/hydra-server/src/redis/mod.rs).
      HYDRA_REDIS_COMMAND_TIMEOUT_MS: "500"
      # Test-only: the bulk CRUD drill is intentionally far above the default 60/min tenant budget.
      HYDRA_TENANT_API_RATE_LIMIT_PER_MIN: "100000"
      # Scale-test envelope (test env only): 2000 users + 8000 keys + 2000 roles.
      HYDRA_MAX_USERS_PER_TENANT: "10000"
      HYDRA_MAX_USER_API_KEYS_PER_TENANT: "40000"
      HYDRA_MAX_HIERARCHY_ROWS: "50000"
      RUST_LOG: "info"
    volumes:
      - hydra-a-data:/app/data
    ports:
      - "127.0.0.1:8080:8080"   # proxy entry (data plane)
      - "127.0.0.1:8081:8081"   # admin REST + UI + /metrics
    depends_on:
      redis: { condition: service_healthy }
      clickhouse-init: { condition: service_completed_successfully }
      mock-llm: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $$HYDRA_ADMIN_TOKEN\" http://127.0.0.1:8081/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ── Hydra node B - raft member (identical to node A and node C) ────────────
  hydra-b:
    image: hydra-local:latest
    container_name: hydra-b
    networks:
      default:
        ipv4_address: 172.28.0.12
    # Docker's default stop grace is 10s (SIGTERM, then SIGKILL), which is far
    # shorter than this process needs: it drains in-flight requests for
    # HYDRA_SHUTDOWN_DRAIN_SECS (default 20) plus a 5s final runtime step.
    # Measured 2026-09-29 on a release build: shutdown takes 25s on SIGTERM and
    # 35s on SIGQUIT, and a SIGKILLed drain loses the buffered usage records
    # (control: 20 proxied requests -> 0 rows in usage_record, vs 20 rows when
    # the drain completes). 30s covers the default SIGTERM path with slack;
    # use 40s if you also set `stop_signal: SIGQUIT`.
    stop_grace_period: 30s
    restart: unless-stopped
    env_file: [../secure/local-test.env]
    environment:
      HYDRA_CLUSTER_PEERS: "node-a=172.28.0.11:8091,node-b=172.28.0.12:8092,node-c=172.28.0.13:8093"
      HYDRA_NODE_ID: "node-b"
      HYDRA_ARACHNE_LISTEN: "172.28.0.12:8092"
      HYDRA_ARACHNE_DATA_DIR: "/app/data/arachne"
      HYDRA_REDIS_URL: "redis://redis:6379"
      HYDRA_REDIS_MODE: "single"
      HYDRA_USAGE_SINK: "clickhouse"
      HYDRA_CLICKHOUSE_URL: "http://clickhouse:8123"
      HYDRA_DB_URL: "sqlite:/app/data/hydra.db?mode=rwc"
      HYDRA_LISTEN: "0.0.0.0:8080"
      HYDRA_ADMIN_ADDR: "0.0.0.0:8081"
      HYDRA_REDIS_COMMAND_TIMEOUT_MS: "500"
      # Test-only: the bulk CRUD drill is intentionally far above the default 60/min tenant budget.
      HYDRA_TENANT_API_RATE_LIMIT_PER_MIN: "100000"
      # Scale-test envelope (test env only): 2000 users + 8000 keys + 2000 roles.
      HYDRA_MAX_USERS_PER_TENANT: "10000"
      HYDRA_MAX_USER_API_KEYS_PER_TENANT: "40000"
      HYDRA_MAX_HIERARCHY_ROWS: "50000"
      RUST_LOG: "info"
    volumes:
      - hydra-b-data:/app/data
    ports:
      - "127.0.0.1:8083:8080"
      - "127.0.0.1:8082:8081"
    depends_on:
      redis: { condition: service_healthy }
      clickhouse-init: { condition: service_completed_successfully }
      mock-llm: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $$HYDRA_ADMIN_TOKEN\" http://127.0.0.1:8081/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ── Hydra node C - raft member (identical to node A and node B) ────────────
  hydra-c:
    image: hydra-local:latest
    container_name: hydra-c
    networks:
      default:
        ipv4_address: 172.28.0.13
    # Docker's default stop grace is 10s (SIGTERM, then SIGKILL), which is far
    # shorter than this process needs: it drains in-flight requests for
    # HYDRA_SHUTDOWN_DRAIN_SECS (default 20) plus a 5s final runtime step.
    # Measured 2026-09-29 on a release build: shutdown takes 25s on SIGTERM and
    # 35s on SIGQUIT, and a SIGKILLed drain loses the buffered usage records
    # (control: 20 proxied requests -> 0 rows in usage_record, vs 20 rows when
    # the drain completes). 30s covers the default SIGTERM path with slack;
    # use 40s if you also set `stop_signal: SIGQUIT`.
    stop_grace_period: 30s
    restart: unless-stopped
    env_file: [../secure/local-test.env]
    environment:
      HYDRA_CLUSTER_PEERS: "node-a=172.28.0.11:8091,node-b=172.28.0.12:8092,node-c=172.28.0.13:8093"
      HYDRA_NODE_ID: "node-c"
      HYDRA_ARACHNE_LISTEN: "172.28.0.13:8093"
      HYDRA_ARACHNE_DATA_DIR: "/app/data/arachne"
      HYDRA_REDIS_URL: "redis://redis:6379"
      HYDRA_REDIS_MODE: "single"
      HYDRA_USAGE_SINK: "clickhouse"
      HYDRA_CLICKHOUSE_URL: "http://clickhouse:8123"
      HYDRA_LISTEN: "0.0.0.0:8080"
      HYDRA_ADMIN_ADDR: "0.0.0.0:8081"
      HYDRA_REDIS_COMMAND_TIMEOUT_MS: "500"
      # Test-only: the bulk CRUD drill is intentionally far above the default 60/min tenant budget.
      HYDRA_TENANT_API_RATE_LIMIT_PER_MIN: "100000"
      # Scale-test envelope (test env only): 2000 users + 8000 keys + 2000 roles.
      HYDRA_MAX_USERS_PER_TENANT: "10000"
      HYDRA_MAX_USER_API_KEYS_PER_TENANT: "40000"
      HYDRA_MAX_HIERARCHY_ROWS: "50000"
      RUST_LOG: "info"
    ports:
      - "127.0.0.1:8090:8080"   # client traffic enters here (any node can serve it)
      # /metrics goes through the same admin-token gate as everywhere else, and
      # this service does have the token (env_file above), so a scraper must send
      # it. (Until the Sept-16 change the admin surface had a token-free edge mode;
      # ADR-0001 deleted that role, and a container built before the change still
      # answers /metrics 200 with no token — a stale local stack, not the contract.)
      - "127.0.0.1:8084:8081"
    volumes:
      - hydra-c-data:/app/data
    depends_on:
      redis: { condition: service_healthy }
      clickhouse-init: { condition: service_completed_successfully }
      mock-llm: { condition: service_healthy }
    healthcheck:
      # Every node serves the admin API (there is no edge role any more), and /api/v1/health
      # requires the Bearer token — same probe as the other two nodes.
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${HYDRA_ADMIN_TOKEN}\" http://127.0.0.1:8081/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ── Backbone: real Redis (shared limits, breaker, L2 cache, invalidation bus) ──
  redis:
    image: redis:7-alpine
    container_name: hydra-local-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  # ── Real Redis for TESTS (dev-plan 铁律 2: Redis 必须连真实实例，禁止 mock) ──
  # Deliberately a SEPARATE instance from the cluster backbone above: the test
  # suite writes and clears keys the running cluster also uses
  # (the invalidation stream, the rate-limit / breaker / L2 keys), so pointing
  # tests at `redis` would corrupt a live local env.
  # Endpoint for `cargo test`: HYDRA_TEST_REDIS_URL=redis://127.0.0.1:6380
  redis-test:
    image: redis:7-alpine
    container_name: hydra-local-redis-test
    # 64 databases: the test harness isolates each test on its own database
    # (the key names are shared production constants), and the default 16 are
    # not enough for the lib suite + integration binaries running in parallel.
    command:
      ["redis-server", "--save", "", "--appendonly", "no", "--databases", "64"]
    ports:
      - "127.0.0.1:6380:6379"   # loopback only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  # ── Usage metering store (cluster mode REQUIRES HYDRA_USAGE_SINK=clickhouse) ─
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: hydra-local-clickhouse
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "127.0.0.1:8123:8123"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # usage_record DDL. The repo ships it as environment/clickhouse/init.sql, but a
  # bind-mounted .sql file is NOT readable in this environment (only executables
  # are), so the DDL is applied by a one-shot client container instead.
  #
  # This DDL MUST stay byte-identical in shape to environment/clickhouse/init.sql
  # (and to the sink's `INSERT INTO usage_record (…)` column list).
  # It previously stopped at an older table (no attribution columns) while the sink
  # wrote those columns — so a fresh `up` on this file failed every usage flush
  # with `NO_SUCH_COLUMN_IN_TABLE` and silently dropped the batch after the retention
  # cap. `CREATE TABLE IF NOT EXISTS` never adds a column to an EXISTING volume,
  # hence the idempotent ALTER below as well.
  clickhouse-init:
    image: clickhouse/clickhouse-server:24.3
    container_name: hydra-local-clickhouse-init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        clickhouse-client --host clickhouse --query "
          CREATE TABLE IF NOT EXISTS usage_record (
            tenant_id          String,
            provider_id        String,
            model_key          String,
            client_api_key     Nullable(String),
            user_id            Nullable(String),
            user_group_id      Nullable(String),
            api_key_id         Nullable(String),
            status_code        UInt16,
            tokens_in          Nullable(UInt64),
            tokens_out         Nullable(UInt64),
            cache_hit_tokens   Nullable(UInt64),
            latency_ms         UInt32,
            forward_latency_ms Nullable(UInt32),
            ttft_ms            Nullable(UInt32),
            upstream_host      Nullable(String),
            error              Nullable(String),
            created_at         String,
            dedup_key          String COMMENT 'row-level idempotency key (per-request trace id), re-sends of one logical event share it and are collapsed by ReplacingMergeTree'
          ) ENGINE = ReplacingMergeTree() ORDER BY (dedup_key, tenant_id, provider_id) SETTINGS non_replicated_deduplication_window = 1000"
        clickhouse-client --host clickhouse --query "
          ALTER TABLE usage_record MODIFY SETTING non_replicated_deduplication_window = 1000"
        clickhouse-client --host clickhouse --query "
          ALTER TABLE usage_record ADD COLUMN IF NOT EXISTS user_id Nullable(String),
            ADD COLUMN IF NOT EXISTS user_group_id Nullable(String),
            ADD COLUMN IF NOT EXISTS api_key_id Nullable(String)"
        echo "[clickhouse-init] usage_record ready (v5: user-hierarchy attribution columns)"
    depends_on:
      clickhouse: { condition: service_healthy }
    restart: "no"

  # ── Local OpenAI-compatible upstream for stability drills ──────────────────
  # No external auth hop: Hydra now authenticates client api-keys internally.
  # The mock returns deterministic chat completions + usage so destructive tests
  # do not call a real provider (or spend real API credits).
  mock-llm:
    image: python:3.12-slim
    container_name: hydra-local-mock-llm
    command:
      - python
      - -c
      - |
        import json, sys
        from http.server import HTTPServer, BaseHTTPRequestHandler
        class H(BaseHTTPRequestHandler):
            def do_POST(self):
                n = int(self.headers.get("Content-Length", 0))
                body = self.rfile.read(n) if n else b"{}"
                try:
                    req = json.loads(body)
                    model = req.get("model", "echo")
                    prompt = (req.get("messages") or [{}])[-1].get("content", "")
                except Exception:
                    model, prompt = "echo", ""
                resp = {"id": "chatcmpl-mock", "object": "chat.completion", "model": model,
                        "choices": [{"index": 0, "message": {"role": "assistant", "content": "ok"},
                                     "finish_reason": "stop"}],
                        "usage": {"prompt_tokens": max(len(prompt)//4, 1), "completion_tokens": 1,
                                  "total_tokens": max(len(prompt)//4, 1) + 1}}
                data = json.dumps(resp).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(data)))
                self.end_headers(); self.wfile.write(data)
            def do_GET(self):
                data = json.dumps({"object": "list", "data": [{"id": "echo", "object": "model"}]}).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(data)))
                self.end_headers(); self.wfile.write(data)
            def log_message(self, *a):
                pass
        HTTPServer(("0.0.0.0", 9090), H).serve_forever()
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9090/',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  hydra-a-data:
  hydra-b-data:
  hydra-c-data:
  redis-data:
  clickhouse-data:
