# Hydra cluster: three IDENTICAL nodes + redis + clickhouse (ADR-0001).
#
# Build the image first:  ./environment/build.sh
#   (the image bundles server,cluster-redis,arachne,usage-clickhouse — see environment/build.sh,
#    and scripts/check_compose_env.cjs, which derives the required set from THESE manifests)
#
# Prereqs:
#   export HYDRA_ADMIN_TOKEN="$(openssl rand -hex 32)"          # admin API, >= 16 chars
#   export HYDRA_CLUSTER_TOKEN="$(openssl rand -hex 32)"        # internal endpoints
#   export HYDRA_ENCRYPTION_KEY="$(openssl rand 32 | base64)"   # SAME on every node
#   python3 environment/init.py  (point it at ANY node's admin port)
#
# Start:
#   docker compose -f docker-compose.cluster.yml up -d
#
# ## What changed in ADR-0001, and why this file looks different
#
# * **Every node is the same node.** There is no leader/edge split: each one proxies, serves the
#   admin API, holds its own SQLite, and is a raft member. The old `HYDRA_ROLE` and the edge
#   service are gone, so the three services below differ ONLY in identity (node id, raft address,
#   published ports, volume) — the environment block is one anchor.
# * **The member list IS the cluster.** `HYDRA_CLUSTER_PEERS` is the same string on every node, and
#   the ORDER is part of the cluster's identity (Arachne derives each member's numeric raft id from
#   its position). Changing the order means changing the cluster.
# * **Membership is FIXED at three.** You cannot `--scale` a raft member: adding or removing one is
#   a membership change that must reach every member, and it is NOT yet wrapped by a command in
#   this repo — change the list on all members together and restart them (see `dev-docs/ops.md`
#   §13). Three is the minimum that tolerates one failure.
# * **No control URL, no lease TTL, no poll interval.** Config reaches each node by materializing
#   the tree from Arachne; leadership is raft's. A deployment that still sets those variables gets
#   a startup ERROR naming them (`RETIRED_CLUSTER_ENV`).
# * Certs ship inside the config tree (migration 0007), not via mounts, and each node keeps its own
#   data volume — there is nothing to share.

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------------
  # The three members. Only the marked lines differ between them.
  # ---------------------------------------------------------------------------------------------
  hydra-a:
    image: hydra:latest
    container_name: hydra-a
    # Docker's default stop grace is 10s (SIGTERM, then SIGKILL), which is far shorter than this
    # process needs: it drains in-flight requests for HYDRA_SHUTDOWN_DRAIN_SECS (default 20) plus a
    # 5s final runtime step. Measured 2026-09-29 on a release build: shutdown takes 25s on SIGTERM
    # and 35s on SIGQUIT, and a SIGKILLed drain loses the buffered usage records (control: 20
    # proxied requests -> 0 rows in usage_record, vs 20 rows when the drain completes). 30s covers
    # the default SIGTERM path with slack; use 40s if you also set `stop_signal: SIGQUIT`.
    stop_grace_period: 30s
    environment: &node-env
      HYDRA_CLUSTER_PEERS: "a=hydra-a:8091,b=hydra-b:8092,c=hydra-c:8093"
      HYDRA_NODE_ID: a                                         # differs (a/b/c)
      HYDRA_ARACHNE_LISTEN: "0.0.0.0:8091"                     # differs; must match the table above
      HYDRA_REDIS_URL: "redis://redis:6379"
      HYDRA_REDIS_MODE: single
      # REQUIRED — no default: it authenticates the internal endpoints (health/status) and
      # identifies a peer.
      HYDRA_CLUSTER_TOKEN: ${HYDRA_CLUSTER_TOKEN:?set HYDRA_CLUSTER_TOKEN="$(openssl rand -hex 32)" — required in cluster mode}
      HYDRA_ADMIN_ADDR: "0.0.0.0:8081"
      HYDRA_LISTEN: "0.0.0.0:8080"
      HYDRA_USAGE_SINK: clickhouse
      HYDRA_CLICKHOUSE_URL: "http://clickhouse:8123"
      # Every node serves the admin API, so every node needs the admin token.
      HYDRA_ADMIN_TOKEN: ${HYDRA_ADMIN_TOKEN:?set HYDRA_ADMIN_TOKEN}
      HYDRA_ENCRYPTION_KEY: ${HYDRA_ENCRYPTION_KEY:?set HYDRA_ENCRYPTION_KEY}
      RUST_LOG: info
    ports:
      # Loopback only — the admin port has no TLS (see docker-compose.yml).
      - "127.0.0.1:8081:8081"   # admin (differs per node: 8081/8082/8083)
      - "127.0.0.1:8091:8091"   # raft  (differs per node: 8091/8092/8093)
    volumes:
      - node-a-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      # EVERY node runs the admin API now (there is no edge role), and /api/v1/health requires the
      # Bearer token. $$ escapes to $ so the shell expands HYDRA_ADMIN_TOKEN at healthcheck runtime.
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${HYDRA_ADMIN_TOKEN}\" http://127.0.0.1:8081/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  hydra-b:
    image: hydra:latest
    container_name: hydra-b
    stop_grace_period: 30s
    environment:
      <<: *node-env
      HYDRA_NODE_ID: b
      HYDRA_ARACHNE_LISTEN: "0.0.0.0:8092"
    ports:
      - "127.0.0.1:8082:8081"
      - "127.0.0.1:8092:8092"
    volumes:
      - node-b-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${HYDRA_ADMIN_TOKEN}\" http://127.0.0.1:8081/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  hydra-c:
    image: hydra:latest
    container_name: hydra-c
    stop_grace_period: 30s
    environment:
      <<: *node-env
      HYDRA_NODE_ID: c
      HYDRA_ARACHNE_LISTEN: "0.0.0.0:8093"
    ports:
      - "127.0.0.1:8083:8081"
      - "127.0.0.1:8093:8093"
    volumes:
      - node-c-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${HYDRA_ADMIN_TOKEN}\" http://127.0.0.1:8081/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    ports:
      # Loopback only, unauthenticated (see docker-compose.yml for the full reasoning):
      # `usage_record` is billing data and an open ClickHouse also accepts DROP.
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  redis-data:
  node-a-data:
  node-b-data:
  node-c-data:
  clickhouse-data:
