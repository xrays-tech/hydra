# Hydra cluster full-stack: redis + leader pair + stateless edges.
#
# Build the image first:  ./environment/build.sh   (with cluster-redis feature:
#   cargo build --release --features server,cluster-redis  → stage to bin/hydra)
#
# Prereqs:
#   export HYDRA_ADMIN_TOKEN="$(openssl rand -hex 32)"          # admin API, >= 16 chars
#   export HYDRA_CLUSTER_TOKEN="$(openssl rand -hex 32)"        # control channel, REQUIRED
#   export HYDRA_ENCRYPTION_KEY="$(openssl rand 32 | base64)"   # SAME on every node
#   python3 environment/init.py  (point it at the leader admin port)
#
# Start:
#   docker compose -f docker-compose.cluster.yml up -d --scale hydra-edge=2
#
# NOTE: the leader's data volume is per-container; failover is state-based
# (the standby materializes the config snapshot into its OWN replica DB), so
# no shared volume is required — certs ship inside the snapshot (migration
# 0007), not via mounts.

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  hydra-control-a:
    image: hydra:latest
    container_name: hydra-control-a
    # Docker's default stop grace is 10s (SIGTERM, then SIGKILL), which is far
    # shorter than this process needs: it drains in-flight requests for
    # HYDRA_SHUTDOWN_DRAIN_SECS (default 20) plus a 5s final runtime step.
    # Measured 2026-09-29 on a release build: shutdown takes 25s on SIGTERM and
    # 35s on SIGQUIT, and a SIGKILLed drain loses the buffered usage records
    # (control: 20 proxied requests -> 0 rows in usage_record, vs 20 rows when
    # the drain completes). 30s covers the default SIGTERM path with slack;
    # use 40s if you also set `stop_signal: SIGQUIT`.
    stop_grace_period: 30s
    environment: &control-env
      HYDRA_ROLE: leader
      HYDRA_REDIS_URL: "redis://redis:6379"
      HYDRA_REDIS_MODE: single
      # REQUIRED — no default: this token authenticates the inter-node config
      # channel (/api/v1/internal/*), which carries the sealed provider keys.
      HYDRA_CLUSTER_TOKEN: ${HYDRA_CLUSTER_TOKEN:?set HYDRA_CLUSTER_TOKEN="$(openssl rand -hex 32)" — required in cluster mode}
      # Control-plane SNAPSHOT URL (standbys/edges poll this for config).
      # It is NOT the admin-mutation forward target: forwarding follows the
      # actual lease holder via the registry, so pointing at this node itself
      # is safe (see dev-docs/cluster.md §5.2).
      HYDRA_CONTROL_URL: "http://hydra-control-a:8081"
      HYDRA_PUBLIC_URL: "http://hydra-control-a:8081"
      HYDRA_NODE_ID: control-a
      HYDRA_LEADER_LEASE_MS: "15000"
      HYDRA_CONTROL_POLL_MS: "500"
      HYDRA_ADMIN_ADDR: "0.0.0.0:8081"
      HYDRA_USAGE_SINK: clickhouse
      HYDRA_CLICKHOUSE_URL: "http://clickhouse:8123"
      HYDRA_ADMIN_TOKEN: ${HYDRA_ADMIN_TOKEN:?set HYDRA_ADMIN_TOKEN}
      HYDRA_ENCRYPTION_KEY: ${HYDRA_ENCRYPTION_KEY:?set HYDRA_ENCRYPTION_KEY}
      RUST_LOG: info
    ports:
      # Loopback only — the admin port has no TLS (see docker-compose.yml).
      - "127.0.0.1:8081:8081"   # admin (the second leader is on 8082, see below)
    volumes:
      - control-a-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      # /api/v1/health requires the admin Bearer token; $$ escapes to $ so the shell
      # expands HYDRA_ADMIN_TOKEN (set above) at healthcheck runtime. The CONTENDER
      # nodes run the admin API, so this is the right probe for them.
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${HYDRA_ADMIN_TOKEN}\" http://127.0.0.1:8081/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # Second leader candidate: expose its admin on 8082 for local drills.
  hydra-control-b:
    image: hydra:latest
    container_name: hydra-control-b
    # Docker's default stop grace is 10s (SIGTERM, then SIGKILL), which is far
    # shorter than this process needs: it drains in-flight requests for
    # HYDRA_SHUTDOWN_DRAIN_SECS (default 20) plus a 5s final runtime step.
    # Measured 2026-09-29 on a release build: shutdown takes 25s on SIGTERM and
    # 35s on SIGQUIT, and a SIGKILLed drain loses the buffered usage records
    # (control: 20 proxied requests -> 0 rows in usage_record, vs 20 rows when
    # the drain completes). 30s covers the default SIGTERM path with slack;
    # use 40s if you also set `stop_signal: SIGQUIT`.
    stop_grace_period: 30s
    environment:
      <<: *control-env
      HYDRA_CONTROL_URL: "http://hydra-control-a:8081"
      HYDRA_PUBLIC_URL: "http://hydra-control-b:8081"
      HYDRA_NODE_ID: control-b
    ports:
      - "127.0.0.1:8082:8081"
    volumes:
      - control-b-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      # /api/v1/health requires the admin Bearer token; $$ escapes to $ so the shell
      # expands HYDRA_ADMIN_TOKEN (set above) at healthcheck runtime. The CONTENDER
      # nodes run the admin API, so this is the right probe for them.
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${HYDRA_ADMIN_TOKEN}\" http://127.0.0.1:8081/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  hydra-edge:
    image: hydra:latest
    # Docker's default stop grace is 10s (SIGTERM, then SIGKILL), which is far
    # shorter than this process needs: it drains in-flight requests for
    # HYDRA_SHUTDOWN_DRAIN_SECS (default 20) plus a 5s final runtime step.
    # Measured 2026-09-29 on a release build: shutdown takes 25s on SIGTERM and
    # 35s on SIGQUIT, and a SIGKILLed drain loses the buffered usage records
    # (control: 20 proxied requests -> 0 rows in usage_record, vs 20 rows when
    # the drain completes). 30s covers the default SIGTERM path with slack;
    # use 40s if you also set `stop_signal: SIGQUIT`.
    stop_grace_period: 30s
    environment:
      HYDRA_ROLE: edge
      HYDRA_REDIS_URL: "redis://redis:6379"
      # REQUIRED — no default: this token authenticates the inter-node config
      # channel (/api/v1/internal/*), which carries the sealed provider keys.
      HYDRA_CLUSTER_TOKEN: ${HYDRA_CLUSTER_TOKEN:?set HYDRA_CLUSTER_TOKEN="$(openssl rand -hex 32)" — required in cluster mode}
      HYDRA_CONTROL_URL: "http://hydra-control-a:8081"
      HYDRA_PUBLIC_URL: "http://hydra-edge:8081"
      HYDRA_CONTROL_POLL_MS: "500"
      HYDRA_ADMIN_ADDR: "0.0.0.0:8081"
      HYDRA_USAGE_SINK: clickhouse
      HYDRA_CLICKHOUSE_URL: "http://clickhouse:8123"
      HYDRA_ENCRYPTION_KEY: ${HYDRA_ENCRYPTION_KEY:?set HYDRA_ENCRYPTION_KEY}
      RUST_LOG: info
    ports:
      - "8080"   # proxy — no host port mapping needed beyond the LB
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      # An EDGE serves no admin API: /api/v1/health answers 404 on it (measured
      # 2026-09-29), so probing that path would mark every healthy edge unhealthy.
      # Its token-free liveness probe is /healthz — same choice as the local stack.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    ports:
      # Loopback only, unauthenticated (see docker-compose.yml for the full
      # reasoning): `usage_record` is billing data and an open ClickHouse also
      # accepts DROP. Nodes reach it as `http://clickhouse:8123`.
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  redis-data:
  control-a-data:
  control-b-data:
  clickhouse-data:
