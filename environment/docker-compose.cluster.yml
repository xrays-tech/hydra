# Hydra cluster: three IDENTICAL nodes + one shared PostgreSQL + redis + clickhouse.
#
# Shared DB + Redis fanout (wired in Phase 3): a write on ANY node commits to the
# shared relational DB and bumps `config_revision.version`; that node then
# publishes `{version,origin}` on `hydra:config:changed`, and every peer reloads
# its in-process snapshot. A 5 s poll of the shared revision is the backstop for
# a missed message or a Redis outage. There is no leader and no raft: the shared
# DB is authoritative, and every node is an equal writer.
#
# Build the image first:  ./environment/build.sh
#   (the image bundles server, one DB backend (db-postgres), cluster-redis and usage-clickhouse —
#    see environment/build.sh, and scripts/check_compose_env.cjs, which derives the required set
#    from THESE manifests)
#
# Prereqs:
#   export HYDRA_ADMIN_TOKEN="$(openssl rand -hex 32)"          # admin API, >= 16 chars
#   (NO HYDRA_CLUSTER_TOKEN: it gated the /api/v1/internal/* family, which is deleted, and the
#    requirement was removed with it on 2026-10-05 — the name is in RETIRED_CLUSTER_ENV, so setting
#    it now only earns an startup ERROR telling you it does nothing.)
#   export HYDRA_ENCRYPTION_KEY="$(openssl rand 32 | base64)"   # SAME on every node
#   python3 environment/init.py  (point it at ANY node's admin port)
#
# Start:
#   docker compose -f docker-compose.cluster.yml up -d
#
# ## Shared-DB, no-raft topology
#
# * **Every node is the same node.** There is no leader/edge split: each one proxies, serves the
#   admin API, and shares the SAME PostgreSQL config database. The three services below differ ONLY
#   in identity (node id and published ports) — the environment block is one anchor.
# * **The cluster switch is `HYDRA_REDIS_URL`.** Redis carries the data-plane state (shared rate
#   limits, breaker votes, invalidation); config authority is the relational database. There is no
#   static member list and no raft transport.
# * **One database, zero per-node volumes.** `HYDRA_DB_URL` is byte-identical on all three nodes;
#   there is no local config DB and no node-*-data volume to drift or to restore separately.
# * Certs ship inside the config rows (migration 0007), not via mounts.
#
# Database credentials below (`hydra/hydra`, database `hydra`) are LOCAL defaults, not production
# secrets. The URL scheme MUST match the compiled backend:
#   postgres://hydra:hydra@postgres:5432/hydra   (hydra:postgres / hydra:latest)
#   mysql://hydra:hydra@mysql:3306/hydra         (hydra:mysql; add a mysql service for it)

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  # One shared config database for all three members. A single writer transaction serializes
  # through `hydra_lock` (see crates/hydra-server/src/db.rs), so this is the config authority.
  postgres:
    image: postgres:16-alpine
    container_name: hydra-postgres
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: hydra
      POSTGRES_DB: hydra
    ports:
      # Loopback only: every tenant/provider/credential row lives here.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydra -d hydra"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------------
  # The three members. Only the marked lines differ between them.
  # ---------------------------------------------------------------------------------------------
  hydra-a:
    image: hydra:latest
    container_name: hydra-a
    # Docker's default stop grace is 10s (SIGTERM, then SIGKILL), which is far shorter than this
    # process needs: it drains in-flight requests for HYDRA_SHUTDOWN_DRAIN_SECS (default 20) plus a
    # 5s final runtime step. Measured 2026-09-29 on a release build: shutdown takes 25s on SIGTERM
    # and 35s on SIGQUIT, and a SIGKILLed drain loses the buffered usage records (control: 20
    # proxied requests -> 0 rows in usage_record, vs 20 rows when the drain completes). 30s covers
    # the default SIGTERM path with slack; use 40s if you also set `stop_signal: SIGQUIT`.
    stop_grace_period: 30s
    environment: &node-env
      HYDRA_NODE_ID: a                                         # differs (a/b/c)
      HYDRA_REDIS_URL: "redis://redis:6379"
      HYDRA_REDIS_MODE: single
      # SAME database URL on every node — there is no per-node config DB.
      HYDRA_DB_URL: "postgres://hydra:hydra@postgres:5432/hydra"
      HYDRA_ADMIN_ADDR: "0.0.0.0:8081"
      HYDRA_LISTEN: "0.0.0.0:8080"
      HYDRA_USAGE_SINK: clickhouse
      HYDRA_CLICKHOUSE_URL: "http://clickhouse:8123"
      # Every node serves the admin API, so every node needs the admin token.
      HYDRA_ADMIN_TOKEN: ${HYDRA_ADMIN_TOKEN:?set HYDRA_ADMIN_TOKEN}
      HYDRA_ENCRYPTION_KEY: ${HYDRA_ENCRYPTION_KEY:?set HYDRA_ENCRYPTION_KEY}
      RUST_LOG: info
    ports:
      # Loopback only — the admin port has no TLS (see docker-compose.yml).
      - "127.0.0.1:8081:8081"   # admin (differs per node: 8081/8082/8083)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      # EVERY node runs the admin API now (there is no edge role), and /api/v1/health requires the
      # Bearer token. $$ escapes to $ so the shell expands HYDRA_ADMIN_TOKEN at healthcheck runtime.
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${HYDRA_ADMIN_TOKEN}\" http://127.0.0.1:8081/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  hydra-b:
    image: hydra:latest
    container_name: hydra-b
    stop_grace_period: 30s
    environment:
      <<: *node-env
      HYDRA_NODE_ID: b
    ports:
      - "127.0.0.1:8082:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${HYDRA_ADMIN_TOKEN}\" http://127.0.0.1:8081/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  hydra-c:
    image: hydra:latest
    container_name: hydra-c
    stop_grace_period: 30s
    environment:
      <<: *node-env
      HYDRA_NODE_ID: c
    ports:
      - "127.0.0.1:8083:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${HYDRA_ADMIN_TOKEN}\" http://127.0.0.1:8081/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    ports:
      # Loopback only, unauthenticated (see docker-compose.yml for the full reasoning):
      # `usage_record` is billing data and an open ClickHouse also accepts DROP.
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  clickhouse-data:
