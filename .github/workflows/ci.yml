name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  SQLX_OFFLINE: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the toolchain explicitly (dtolnay/rust-toolchain sets
      # RUSTUP_TOOLCHAIN, overriding rust-toolchain.toml's "stable"): a
      # latest-stable drift changed the clippy lint set mid-flight (1.97 →
      # 1.98 turned on `result_large_err`), making CI non-reproducible. This
      # repo's rust-toolchain.toml stays "stable" for local development;
      # CI always evaluates against the pinned version. Bump deliberately.
      - name: Install Rust toolchain (pinned 1.98.0)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Cargo.lock is committed; fail fast if a Cargo.toml change left it out of
      # sync. `--locked --dry-run` exits non-zero when the lockfile would change.
      - name: Verify Cargo.lock is up to date
        run: cargo update --workspace --locked --dry-run

      - name: Format check
        run: cargo fmt --check

      # `--all-targets` compiles the integration tests (tests/*.rs), which
      # reference sqlx / hydra_server::db and therefore require the `server`
      # feature (db/proxy/http-client/runtime). Without it, default-features
      # (empty) leaves sqlx unresolved and the step fails. Scope the feature to
      # hydra-server via pkg/feat syntax; hydra-core clippies with its defaults.
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --features hydra-server/server -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --features hydra-server/server

      # T1.1 / T1.2 / T10.1 (mirror) / T10.2 — the pure-core suite, incl. the
      # in-process dependency-firewall test.
      - name: Test hydra-core (pure)
        run: cargo test -p hydra-core

      # T10.1 — authoritative dependency firewall. Asserts `hydra-core`'s
      # resolved tree contains NONE of tokio/pingora/sqlx/reqwest/hyper
      # (memchr/bytes/sha2 are pure and allowed). `grep -E ...` exits non-zero
      # (and fails the step) if any forbidden crate name appears.
      - name: Dependency firewall (hydra-core has zero I/O deps)
        run: |
          set -euo pipefail
          tree="$(cargo tree -p hydra-core --no-default-features)"
          echo "$tree"
          if echo "$tree" | grep -E ' (tokio|pingora|sqlx|reqwest|hyper)(-[^ ]+)? v'; then
            echo "::error::hydra-core pulls a forbidden I/O dependency (see tree above)"
            exit 1
          fi
          echo "OK: hydra-core has no I/O dependencies."

      # The full server suite runs with the `server` feature (W4+). It is a hard
      # CI gate: the suite is green (138 tests across 17 binaries). If a test
      # becomes genuinely flaky, quarantine + fix it rather than muting the gate.
      - name: Test hydra-server (shell)
        run: cargo test -p hydra-server --features server
