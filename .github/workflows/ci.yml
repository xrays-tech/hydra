name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  SQLX_OFFLINE: "true"
  # dev-plan 铁律 2: Redis-dependent tests must talk to a REAL Redis — the
  # in-process double is forbidden. The service container below publishes
  # 6379 on localhost; a test that needs Redis FAILS LOUDLY when this is unset
  # rather than silently falling back to a mock.
  HYDRA_TEST_REDIS_URL: "redis://127.0.0.1:6379"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # dev-plan 铁律 2: Redis-dependent tests need a REAL Redis (an in-process
      # double is forbidden). Started here rather than as a service container so
      # it can run with 64 databases — the harness gives every test its own
      # database, and the default 16 wrap around under a parallel test run.
      - name: Start a real Redis for tests
        run: |
          set -euo pipefail
          docker run -d --name hydra-test-redis -p 6379:6379 \
            redis:7-alpine redis-server --save "" --appendonly no --databases 64
          for _ in $(seq 1 30); do
            if docker exec hydra-test-redis redis-cli ping >/dev/null 2>&1; then
              echo "redis is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::the test Redis did not become reachable"; exit 1

      # Pin the toolchain explicitly (dtolnay/rust-toolchain sets
      # RUSTUP_TOOLCHAIN, overriding rust-toolchain.toml): a latest-stable
      # drift changed the clippy lint set mid-flight (1.97 → 1.98 turned on
      # `result_large_err`), making CI non-reproducible. rust-toolchain.toml
      # pins the same 1.98.0 for local development, so local fmt/clippy match
      # the CI gate exactly. Bump deliberately.
      - name: Install Rust toolchain (pinned 1.98.0)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Cargo.lock is committed; fail fast if a Cargo.toml change left it out of
      # sync. `--locked --dry-run` exits non-zero when the lockfile would change.
      - name: Verify Cargo.lock is up to date
        run: cargo update --workspace --locked --dry-run

      - name: Format check
        run: cargo fmt --check

      # `--all-targets` compiles the integration tests (tests/*.rs), which
      # reference sqlx / hydra_server::db and therefore require the `server`
      # feature (db/proxy/http-client/runtime). Without it, default-features
      # (empty) leaves sqlx unresolved and the step fails. Scope the feature to
      # hydra-server via pkg/feat syntax; hydra-core clippies with its defaults.
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --features hydra-server/server -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --features hydra-server/server

      # T1.1 / T1.2 / T10.1 (mirror) / T10.2 — the pure-core suite, incl. the
      # in-process dependency-firewall test.
      - name: Test hydra-core (pure)
        run: cargo test -p hydra-core

      # T10.1 — authoritative dependency firewall. Asserts `hydra-core`'s
      # resolved tree contains NONE of tokio/pingora/sqlx/reqwest/hyper
      # (memchr/bytes/sha2 are pure and allowed). `grep -E ...` exits non-zero
      # (and fails the step) if any forbidden crate name appears.
      - name: Dependency firewall (hydra-core has zero I/O deps)
        run: |
          set -euo pipefail
          tree="$(cargo tree -p hydra-core --no-default-features)"
          echo "$tree"
          if echo "$tree" | grep -E ' (tokio|pingora|sqlx|reqwest|hyper)(-[^ ]+)? v'; then
            echo "::error::hydra-core pulls a forbidden I/O dependency (see tree above)"
            exit 1
          fi
          echo "OK: hydra-core has no I/O dependencies."

      # The full server suite runs with the `server` feature (W4+). It is a hard
      # CI gate: keep it green. If a test becomes genuinely flaky, quarantine +
      # fix it rather than muting the gate. (The `optional-features` job below
      # covers `cluster-redis` / `usage-clickhouse`, which `server` does not
      # pull in — and which nothing used to compile at all.)
      - name: Test hydra-server (shell)
        run: cargo test -p hydra-server --features server

  # Neither `cluster-redis` (Redis-backed leader lease, cluster rate limits,
  # shared breaker votes, auth-cache L2, invalidation stream) nor
  # `usage-clickhouse` (the ClickHouse sink) is implied by `server`. Nothing
  # used to compile them, so several thousand lines of production code and
  # ~36 tests — including the entire cross-node suite — could break, or stop
  # compiling, without CI noticing. environment/build.sh ships an image built
  # from exactly this feature set, so a break here ships a broken binary.
  optional-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # dev-plan 铁律 2: Redis-dependent tests need a REAL Redis (an in-process
      # double is forbidden). Started here rather than as a service container so
      # it can run with 64 databases — the harness gives every test its own
      # database, and the default 16 wrap around under a parallel test run.
      - name: Start a real Redis for tests
        run: |
          set -euo pipefail
          docker run -d --name hydra-test-redis -p 6379:6379 \
            redis:7-alpine redis-server --save "" --appendonly no --databases 64
          for _ in $(seq 1 30); do
            if docker exec hydra-test-redis redis-cli ping >/dev/null 2>&1; then
              echo "redis is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::the test Redis did not become reachable"; exit 1

      - name: Install Rust toolchain (pinned 1.98.0)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (deny warnings, optional features)
        run: cargo clippy --workspace --all-targets --features hydra-server/server,hydra-server/cluster-redis,hydra-server/usage-clickhouse -- -D warnings

      - name: Build workspace (optional features)
        run: cargo build --workspace --features hydra-server/server,hydra-server/cluster-redis,hydra-server/usage-clickhouse

      - name: Test hydra-server (optional features)
        run: cargo test -p hydra-server --features server,cluster-redis,usage-clickhouse

  # The admin UI, its i18n and the shell entry points have their own checks and
  # tests, and NOTHING ran them: `check_i18n.js` had already found two real
  # issues when it was written, and it would not have found a third (review C2).
  # No build step is involved — the UI is plain ES2017 loaded from disk.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: i18n consistency (code↔en, dead keys, all locales)
        run: node scripts/check_i18n.js

      - name: i18n checker tests
        run: node --test scripts/check_i18n.test.cjs

      - name: "Shell checks: LLM_API_KEY required, no request when unset (ask_llm)"
        run: bash scripts/ask_llm.test.sh
