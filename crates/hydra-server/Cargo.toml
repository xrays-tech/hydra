[package]
name = "hydra-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hydra I/O shell — Pingora proxy, sqlx store, reqwest auth. Thin adapter over hydra-core."

# W4: the `hydra` binary bootstraps the Pingora proxy server (design §15.1).
[[bin]]
name = "hydra"
path = "src/main.rs"
required-features = ["server"]

[features]
default = []

# Granular, composable feature set so each wave can compile its slice of the
# I/O shell WITHOUT pulling unrelated native deps (e.g. W2/W3 must build with
# only sqlx/reqwest and never touch pingora/BoringSSL on macOS).
#
# `dep:` syntax is used so enabling a feature does NOT auto-activate the dep
# under the same name (feature/dep decoupling).
#
# - `runtime`    : shared async-runtime helpers (tokio, dashmap, arc-swap,
#                  tracing, prometheus, thiserror, chrono, include_dir).
#                  Required by every I/O module.
# - `db`         : sqlx pool / migrations / repo (W2).
# - `http-client`: reqwest auth upstream (W3).
# - `proxy`        : pingora proxy shell over plain TCP (W4a). No TLS backend —
#                   the plain `add_tcp` listener. Enables `tls` only via a
#                   backend feature below.
# - `tls-boringssl`: downstream per-tenant TLS via Pingora's BoringSSL backend
#                   (design §12.1 default). `HydraCertStore` SNI cert callback.
# - `tls-openssl`  : same downstream TLS via the OpenSSL backend (design §12.1
#                   explicitly allows "BoringSSL/OpenSSL 衍生"); use where the
#                   vendored BoringSSL build is impractical (e.g. macOS without a
#                   working Go/cmake toolchain).
# - `server`     : umbrella for full/W4+ builds (= db + http-client + proxy +
#                   tls-boringssl default).
# - `usage-clickhouse`: optional ClickHouse usage sink (design §9.3).
runtime = [
    "dep:tokio",
    "dep:dashmap",
    "dep:arc-swap",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:prometheus",
    "dep:thiserror",
    "dep:chrono",
    "dep:include_dir",
    # W5 admin REST API: JSON (de)serialisation + the async-trait/http types
    # required to impl pingora's `ServeHttp`. Pulled into `runtime` so the
    # admin module (and its metric call-sites in the proxy) always have them.
    "dep:async-trait",
    "dep:http",
    "dep:serde",
    "dep:serde_json",
]
db = ["runtime", "dep:sqlx", "dep:aes-gcm", "dep:base64", "dep:rand"]
http-client = ["runtime", "dep:reqwest"]
# `proxy` now implies `db` + `http-client`: the proxy shell uses ConfigStore
# (W2) and reqwest (W3 auth upstream + W4 breaker probe), so `--features proxy`
# must build standalone (W4b follow-up). TLS backends below still imply `proxy`.
proxy = [
    "runtime",
    "db",
    "http-client",
    "dep:pingora",
    "dep:pingora-proxy",
    "dep:pingora-core",
    "dep:pingora-http",
    "dep:rand",
    "dep:async-trait",
    "dep:bytes",
    "dep:http",
]
# Downstream TLS backends (design §12.1). Exactly one should be combined with
# `proxy`/`server`. Both imply `proxy` (the shell) and forward the matching
# backend feature to every pingora crate so the same TLS impl is linked
# everywhere (feature unification). `dep:`/`?` syntax keeps the deps optional.
tls-boringssl = ["proxy", "pingora-core?/boringssl", "pingora?/boringssl", "pingora-proxy?/boringssl"]
tls-openssl = ["proxy", "pingora-core?/openssl", "pingora?/openssl", "pingora-proxy?/openssl"]
server = ["db", "http-client", "proxy", "tls-boringssl"]

# Optional usage sink (design §9.3). Off by default.
# Dependencies are minimal: the sink talks to ClickHouse over its native HTTP
# interface (INSERT … FORMAT JSONEachRow) and never uses the `clickhouse` crate
# (the 0.1 placeholder pin was a W1 leftover — see sink.rs module docs).
# `base64` is only for HTTP Basic auth when the URL carries `user:pass@` creds.
# Compiling the feature adds BOTH sinks (sqlite + clickhouse) to one binary;
# the active one is chosen at runtime by HYDRA_USAGE_SINK.
usage-clickhouse = ["dep:base64"]

# Redis backbone (cluster P2+): leader lease, shared rate limits / breaker,
# auth-cache L2 and the invalidation stream all ride one Redis. Opt-in so the
# default single-node build keeps zero external deps. `fred` is the fixed
# client choice (v8 plan Q8): full single/sentinel/cluster/streams/Lua
# support; `mocks` powers in-process command-level test doubles; `i-scripts`
# enables the Lua lease renew / rate-limit scripts.
cluster-redis = ["dep:fred"]

[dependencies]
# Always link the pure core.
hydra-core = { path = "../hydra-core" }

# --- Server runtime (gated behind `server`) -------------------------------
pingora = { version = "0.8", optional = true }
pingora-proxy = { version = "0.8", optional = true }
pingora-core = { version = "0.8", optional = true }
pingora-http = { version = "0.8", optional = true }
rand = { version = "0.8", optional = true }
async-trait = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
dashmap = { version = "6", optional = true }
arc-swap = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.1", optional = true }
prometheus = { version = "0.13", optional = true }
thiserror = { version = "1", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
include_dir = { version = "0.7", optional = true }
# W5 admin REST API (design §13): JSON encode/decode for entities + own types.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

# --- At-rest encryption (provider api-keys, design §16.2) ------------------
# Gated behind `db` (the encrypt-on-write boundary lives in `db.rs`). Pure-safe
# Rust; does NOT touch the hydra-core dependency firewall.
aes-gcm = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }

# --- Cluster Redis backbone (v8 plan, feature `cluster-redis`) --------------
fred = { version = "10", features = ["mocks", "i-scripts"], optional = true }

# --- Optional sink --------------------------------------------------------
# (no extra dependency: the ClickHouse sink uses tokio's HTTP primitives only,
# see the `usage-clickhouse` feature comment above)

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
