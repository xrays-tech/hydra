# Redis configuration for the shared Hydra data plane.
#
# The password is supplied on the command line by docker-compose.yml (`--requirepass ${REDIS_PASSWORD}`)
# so it is not committed here.
#
# This instance holds only rate-limit/breaker/auth-L2 state (volatile), so `volatile-lru`
# eviction plus a hard 512 MB cap is safe: losing a key degrades to a conservative
# re-evaluation, never to a lost write. `appendonly yes` keeps the state across a restart.

bind 0.0.0.0
protected-mode yes
port 6379

# Persistence: AOF with per-second fsync. RDB is left at defaults.
appendonly yes
appendfsync everysec
dir /data

# Bounded memory: never let Redis grow past the box's budget. All keys are evictable, so the
# cap always wins over an OOM kill.
maxmemory 512mb
maxmemory-policy volatile-lru
